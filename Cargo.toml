[package]
name = "synth"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CubeCL Kern-Infrastruktur stabil von Crates.io
cubecl = { version = "0.10.0", default-features = false, features = ["wgpu", "std"] }
cubecl-wgpu = "0.10.0"
cubecl-runtime = "0.10.0"
cubecl-zspace = "0.10.0"
cubecl-common = { version = "0.10.0", features = ["serde"] }

# --- REVOLUTIONÄRE EXTREM-AKTIVIERUNG: Alle HPC-Audio- und KI-Module freischalten! ---
cubek = { version = "0.2.0", features = [
    "reduce", 
    "random", 
    "convolution", 
    "interpolate", 
    "fft", 
    "quantization", 
    "matmul", 
    "attention", 
    "stdlib"
] }

# Unverzichtbare Hilfsmittel für Datentypen und JavaScript-Brücke
bytemuck = { version = "1.16", features = ["derive"] }
wasm-bindgen = "0.2.95"
pollster = "0.3"
js-sys = "0.3.72"
wasm-bindgen-futures = "0.4.45"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde_json = { version = "1.0", features = ["alloc"] }
