[package]
name = "synth"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cubecl = { version = "0.10.0", features = ["wgpu", "std"] }
cubecl-wgpu = "0.10.0"
cubecl-runtime = "0.10.0"
cubecl-zspace = "0.10.0"
cubecl-common = { version = "0.10.0", features = ["serde"] }

cubek = "0.2.0"

bytemuck = { version = "1.16", features = ["derive"] }
wasm-bindgen = "0.2.95"
pollster = "0.3"
js-sys = "0.3.72"
wasm-bindgen-futures = "0.4.45"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde_json = { version = "1.0", features = ["alloc"] }
