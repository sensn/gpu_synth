<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>CubeCL WebGPU 6-OP DX7 Synthesizer</title>
    <style>
        body { font-family: sans-serif; background: #0c0c0c; color: #fff; padding: 30px; margin: 0; }
        h1 { color: #00ffcc; margin-top: 0; text-transform: uppercase; font-size: 22px; letter-spacing: 2px; }
        p { color: #666; font-size: 13px; margin: 5px 0 20px 0; }
        
        /* TAB SYSTEM STYLING */
        .tabs-nav { display: flex; gap: 4px; border-bottom: 2px solid #222; margin-bottom: 20px; }
        .tab-btn { background: #141414; border: 1px solid #252525; border-bottom: none; color: #aaa; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 4px 4px 0 0; font-size: 12px; text-transform: uppercase; }
        .tab-btn:hover { color: #00ffcc; background: #1c1c1c; }
        .tab-btn.active { color: #00ffcc; background: #222; border-color: #00ffcc #252525 transparent #252525; position: relative; bottom: -2px; }
        
        .tab-content { display: none; background: #141414; padding: 25px; border-radius: 0 0 8px 8px; border: 1px solid #252525; min-height: 250px; }
        .tab-content.active { display: block; }

        /* GRID CONTROLS */
        .op-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .control-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .slider-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        label { font-size: 12px; color: #aaa; font-weight: bold; text-transform: uppercase; }
        .val-display { font-size: 12px; color: #00ffcc; font-family: monospace; font-weight: bold; }
        input[type="range"] { width: 100%; background: #222; accent-color: #00ffcc; cursor: pointer; }
        select { background: #222; color: #00ffcc; border: 1px solid #333; padding: 5px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        
        button#start-btn { padding: 12px 24px; font-size: 14px; background: #00ffcc; border: none; cursor: pointer; color: #000; font-weight: bold; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        button#start-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        .vu-container { background: #141414; padding: 15px; border-radius: 8px; border: 1px solid #252525; display: flex; flex-direction: column; gap: 8px; width: 280px; float: right; margin-top: -10px; }
        .vu-row { display: flex; align-items: center; }
        .vu-label { width: 20px; font-size: 12px; color: #666; font-weight: bold; }
        .vu-track { flex-grow: 1; height: 10px; background: #111; border-radius: 2px; overflow: hidden; }
        .vu-bar { height: 100%; width: 0%; background: linear-gradient(to right, #00ffcc 0%, #00ffcc 75%, #ffcc00 88%, #ff3333 100%); transition: width 0.04s ease-out; }

        /* PIANO KEYBOARD */
        .keyboard-container { margin-top: 25px; background: #141414; padding: 20px; border-radius: 8px; border: 1px solid #252525; }
        .keyboard-container h3 { margin: 0 0 12px 0; font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .piano { display: flex; flex-wrap: wrap; gap: 2px; }
        .key { width: 42px; height: 110px; background: #f4f4f4; border: 1px solid #999; border-radius: 0 0 4px 4px; cursor: pointer; position: relative; }
        .key:active, .key.active { background: #00ffcc; border-color: #00ffcc; }
        .key .key-label { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 10px; color: #333; font-weight: bold; }
        .key .key-note { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 9px; color: #888; }
        .drone-toggle { margin-top: 15px; display: flex; align-items: center; gap: 10px; }
        .drone-toggle label { font-size: 12px; color: #aaa; text-transform: uppercase; }
        .drone-toggle input { accent-color: #00ffcc; width: 18px; height: 18px; cursor: pointer; }
        .gate-status { font-size: 11px; color: #666; font-family: monospace; margin-left: auto; }
    </style>
</head>
<body>

    <div class="vu-container">
        <div class="vu-row"><span class="vu-label">L</span><div class="vu-track"><div id="vu-bar-l" class="vu-bar"></div></div></div>
        <div class="vu-row"><span class="vu-label">R</span><div class="vu-track"><div id="vu-bar-r" class="vu-bar"></div></div></div>
    </div>

    <h1>🎛️ CubeCL WebGPU 6-OP DX7 FM Synthesizer</h1>
    <p>Voll-vektorisiertes Operator-Modell im Frequenzbereich via WebAssembly & WGSL</p>

    <button id="start-btn">Audio Engine Starten</button>

    <!-- NAVIGATION DER TABS -->
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="openTab(event, 'tab-master')">Master & VCA</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-op1')">Operator 1</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-op2')">Operator 2</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-op3')">Operator 3</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-op4')">Operator 4</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-op5')">Operator 5</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-op6')">Operator 6</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-effects')">Filter & Hall</button>
    </div>

    <!-- TAB MASTER -->
    <div id="tab-master" class="tab-content active">
        <div class="op-grid">
            <div class="control-group">
                <div class="slider-row"><label>Hauptlautstärke (Gain)</label><span id="gain-val" class="val-display">4.0x</span></div>
                <input type="range" id="gain-slider" min="0" max="15" value="4" step="0.5">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Frequenz (Grundnote)</label><span id="freq-val" class="val-display">110 Hz</span></div>
                <input type="range" id="freq-slider" min="55" max="440" value="110" step="1">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Master Attack</label><span id="attack-val" class="val-display">0.10s</span></div>
                <input type="range" id="attack-slider" min="0.0" max="2.0" value="0.1" step="0.05">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Master Decay</label><span id="decay-val" class="val-display">0.30s</span></div>
                <input type="range" id="decay-slider" min="0.0" max="2.0" value="0.3" step="0.05">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Master Sustain</label><span id="sustain-val" class="val-display">70%</span></div>
                <input type="range" id="sustain-slider" min="0" max="100" value="70" step="1">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Master Release</label><span id="release-val" class="val-display">0.40s</span></div>
                <input type="range" id="release-slider" min="0.0" max="4.0" value="0.4" step="0.05">
            </div>
            <div class="control-group">
                <label style="margin-bottom: 4px;">DX7 Algorithmus-Struktur</label>
                <select id="algo-select">
                    <option value="0" selected>Algo 1: Kaskadierte 6-OP Kette</option>
                    <option value="1">Algo 2: Parallele FM-Cluster</option>
                </select>
            </div>
        </div>
    </div>

    <!-- GENERISCHE ERZEUGUNG DER 6 OPERATOR TABS -->
    <div id="op-tabs-container">
        <script>
            const opDefaults = [
                { r: 1.0, l: 1.0 }, { r: 1.0, l: 0.7 }, { r: 3.5, l: 1.0 },
                { r: 2.0, l: 0.8 }, { r: 7.0, l: 1.5 }, { r: 0.5, l: 0.4 }
            ];
            opDefaults.forEach((op, idx) => {
                const num = idx + 1;
                document.write(`
                    <div id="tab-op${num}" class="tab-content">
                        <h3>Operator ${num} (Sine Wave Generator)</h3>
                        <div class="op-grid">
                            <div class="control-group">
                                <div class="slider-row"><label>Frequenz-Verhältnis (Ratio)</label><span id="op${num}-ratio-val" class="val-display">${op.r.toFixed(2)}x</span></div>
                                <input type="range" id="op${num}-ratio-slider" min="0.25" max="12.0" value="${op.r}" step="0.05">
                            </div>
                            <div class="control-group">
                                <div class="slider-row"><label>Ausgangspegel (Level / Index)</label><span id="op${num}-level-val" class="val-display">${op.l.toFixed(2)}</span></div>
                                <input type="range" id="op${num}-level-slider" min="0.0" max="5.0" value="${op.l}" step="0.05">
                            </div>
                        </div>
                    </div>
                `);
            });
        </script>
    </div>

        <!-- TAB EFFECTS -->
    <div id="tab-effects" class="tab-content">
        <div class="op-grid">
            <div class="control-group">
                <div class="slider-row"><label>Filter Basis-Cutoff</label><span id="cutoff-val" class="val-display">800 Hz</span></div>
                <input type="range" id="cutoff-slider" min="200" max="4000" value="800">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Moog Ladder Resonanz</label><span id="moog-res-val" class="val-display">1.50</span></div>
                <input type="range" id="moog-res-slider" min="0.0" max="3.5" value="1.5" step="0.05">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Oberheim SEM Resonanz</label><span id="obe-res-val" class="val-display">0.50</span></div>
                <input type="range" id="obe-res-slider" min="0.0" max="0.95" value="0.5" step="0.05">
            </div>
            <div class="control-group">
                <label style="margin-bottom: 4px;">Oberheim Modus</label>
                <select id="obe-mode-select">
                    <option value="0" selected>LowPass</option>
                    <option value="1">HighPass</option>
                    <option value="2">BandPass</option>
                </select>
            </div>
            <div class="control-group">
                <div class="slider-row"><label>LFO Geschwindigkeit</label><span id="lfo-freq-val" class="val-display">5.0 Hz</span></div>
                <input type="range" id="lfo-freq-slider" min="0.1" max="20.0" value="5.0" step="0.1">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>LFO Modulationstiefe</label><span id="lfo-depth-val" class="val-display">300 Hz</span></div>
                <input type="range" id="lfo-depth-slider" min="0" max="1000" value="300" step="10">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Hall Raumgröße</label><span id="room-val" class="val-display">2.5s</span></div>
                <input type="range" id="room-slider" min="0.5" max="5.0" value="2.5" step="0.1">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Höhen-Dämpfung (Damping)</label><span id="damping-val" class="val-display">1.2</span></div>
                <input type="range" id="damping-slider" min="0.0" max="5.0" value="1.2" step="0.1">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Stereobreite (Width)</label><span id="width-val" class="val-display">85%</span></div>
                <input type="range" id="width-slider" min="0" max="100" value="85" step="5">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Hall Wet Mix</label><span id="wet-val" class="val-display">40%</span></div>
                <input type="range" id="wet-slider" min="0" max="100" value="40">
            </div>
    </div>

    <!-- PIANO KEYBOARD FÜR NOTE-EVENTS -->
    <div class="keyboard-container">
        <h3>🎹 Keyboard — Note Events (Computer-Tastatur: A W S E D F T G Z H U J K)</h3>
        <div class="piano" id="piano-container"></div>
        <div class="drone-toggle">
            <input type="checkbox" id="drone-mode" checked>
            <label for="drone-mode">Drone-Modus (Gate dauerhaft offen — alter Verhalten)</label>
            <span class="gate-status" id="gate-status">Gate: OFF</span>
        </div>
    </div>

    <script type="module">
    import init, { WebAudioEngine } from './pkg/synth.js';

    let audioEngine;
    let audioContext;
    let nextStartTime = 0;
    let isPlaying = false;
    const lookAheadTimeMs = 25.0;
    const scheduleAheadTime = 0.1;

    // Glättungssystem für Basisparameter
    let targets = { freq: 110, cut: 800, att: 0.1, dec: 0.3, sus: 0.7, rel: 0.4, room: 2.5, wet: 0.4, m_res: 1.5, o_res: 0.5, l_frq: 5.0, l_dpt: 300, width: 0.85, damp: 1.2 };
    let current = { freq: 110, cut: 800, att: 0.1, dec: 0.3, sus: 0.7, rel: 0.4, room: 2.5, wet: 0.4, m_res: 1.5, o_res: 0.5, l_frq: 5.0, l_dpt: 300, width: 0.85, damp: 1.2 };

    // Vektorisierte Glättungsregister für alle 6 OPs
    let targetRatios = new Float32Array([1.0, 1.0, 3.5, 2.0, 7.0, 0.5]);
    let currentRatios = new Float32Array([1.0, 1.0, 3.5, 2.0, 7.0, 0.5]);
    let targetLevels = new Float32Array([1.0, 0.7, 1.0, 0.8, 1.5, 0.4]);
    let currentLevels = new Float32Array([1.0, 0.7, 1.0, 0.8, 1.5, 0.4]);

    // openTab im globalen Fenster-Scope verankert, damit es für das HTML sichtbar ist
    window.openTab = function(evt, tabId) {
        let i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) { tabcontent[i].className = "tab-content"; }
        tablinks = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tablinks.length; i++) { tablinks[i].className = "tab-btn"; }
        document.getElementById(tabId).className = "tab-content active";
        evt.currentTarget.className = "tab-btn active";
    }

    async function startEngine() {
        console.log("Initialisiere WebAssembly und echte WebGPU-Hardware...");
        try {
            await init();
            let rawEngine = new WebAudioEngine();
            audioEngine = await rawEngine.init_engine_async();
            console.log("CubeCL WebAudioEngine geladen. Starte GPU-Warm-Up... ⚙️");
            
            // Warm-Up Parameteraufruf exakt an die 18 Parameter der lib.rs angepasst
            await audioEngine.render_block_async(
                110.0, 800.0, 2.5, 0.4, 0.1, 0.3, 0.7, 0.4,
                currentRatios, currentLevels, 0, 1.5, 0.5, 0,
                5.0, 300.0, 0.85, 1.2
            );
            console.log("GPU Kernel-Kompilierung (WGSL) abgeschlossen! 🚀 Pipeline ist frei.");
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
            if (audioContext.state === 'suspended') await audioContext.resume();
            
            // Drone-Modus: Gate sofort öffnen, damit der Sound wie vorher sofort startet
            if (document.getElementById("drone-mode").checked) {
                audioEngine.note_on(110.0);
                updateGateStatus();
            }
            
            document.getElementById("start-btn").disabled = true;
            document.getElementById("start-btn").innerText = "Engine läuft 🟢";
            nextStartTime = audioContext.currentTime + 0.15;
            isPlaying = true;
            schedulerLoop();
        } catch (e) { console.error("Kritischer Fehler beim Starten:", e); }
    }

    async function schedulerLoop() {
        if (!isPlaying) return;
        while (nextStartTime < audioContext.currentTime + scheduleAheadTime) { await spawnGpuBlock(); }
        setTimeout(schedulerLoop, lookAheadTimeMs);
    }

    async function spawnGpuBlock() {
        targets.freq = parseFloat(document.getElementById("freq-slider").value);
        targets.cut = parseFloat(document.getElementById("cutoff-slider").value);
        targets.att = parseFloat(document.getElementById("attack-slider").value);
        targets.dec = parseFloat(document.getElementById("decay-slider").value);
        targets.sus = parseFloat(document.getElementById("sustain-slider").value) / 100.0;
        targets.rel = parseFloat(document.getElementById("release-slider").value);
        targets.room = parseFloat(document.getElementById("room-slider").value);
        targets.wet = parseFloat(document.getElementById("wet-slider").value) / 100.0;
        targets.m_res = parseFloat(document.getElementById("moog-res-slider").value);
        targets.o_res = parseFloat(document.getElementById("obe-res-slider").value);
        targets.l_frq = parseFloat(document.getElementById("lfo-freq-slider").value);
        targets.l_dpt = parseFloat(document.getElementById("lfo-depth-slider").value);
        targets.width = parseFloat(document.getElementById("width-slider").value) / 100.0;
        targets.damp = parseFloat(document.getElementById("damping-slider").value);
        
        const algo = parseInt(document.getElementById("algo-select").value);
        const obeMode = parseInt(document.getElementById("obe-mode-select").value);
        const volumeGain = parseFloat(document.getElementById("gain-slider").value);

        for (let i = 0; i < 6; i++) {
            targetRatios[i] = parseFloat(document.getElementById(`op${i+1}-ratio-slider`).value);
            targetLevels[i] = parseFloat(document.getElementById(`op${i+1}-level-slider`).value);
            
            currentRatios[i] += 0.25 * (targetRatios[i] - currentRatios[i]);
            currentLevels[i] += 0.25 * (targetLevels[i] - currentLevels[i]);
        }

        for (let key in targets) { current[key] += 0.25 * (targets[key] - current[key]); }

        // Isoliertes Array-Gating gegen Data-Races an der WASM-Kopplung
        const sendRatios = new Float32Array(currentRatios);
        const sendLevels = new Float32Array(currentLevels);

        try {
            const audioData = await audioEngine.render_block_async(
                current.freq, current.cut, current.room, current.wet, current.att, current.dec,
                current.sus, current.rel,
                sendRatios, sendLevels, algo, current.m_res, current.o_res, obeMode,
                current.l_frq, current.l_dpt, current.width, current.damp
            );

            const bufferSize = audioData.length / 2;
            const audioBuffer = audioContext.createBuffer(2, bufferSize, 44100);
            const leftChannel = audioBuffer.getChannelData(0);
            const rightChannel = audioBuffer.getChannelData(1);
            let maxPeakL = 0.0, maxPeakR = 0.0;

            for (let i = 0; i < bufferSize; i++) {
                const lSample = audioData[i * 2] * volumeGain;
                const rSample = audioData[i * 2 + 1] * volumeGain;
                leftChannel[i] = lSample; rightChannel[i] = rSample;
                const absL = Math.abs(lSample), absR = Math.abs(rSample);
                if (absL > maxPeakL) maxPeakL = absL; if (absR > maxPeakR) maxPeakR = absR;
            }

            updateVuMeter(maxPeakL, maxPeakR);
            const bufferSource = audioContext.createBufferSource();
            bufferSource.buffer = audioBuffer;
            bufferSource.connect(audioContext.destination);
            bufferSource.start(nextStartTime);
            nextStartTime += bufferSize / 44100;

        } catch (gpuError) { console.error("WebGPU Pipeline Stau:", gpuError); }
    }

    function updateVuMeter(peakL, peakR) {
        const dbL = 20 * Math.log10(Math.max(1e-5, peakL)), dbR = 20 * Math.log10(Math.max(1e-5, peakR));
        let pL = ((dbL - (-45)) / 45) * 100, pR = ((dbR - (-45)) / 45) * 100;
        document.getElementById("vu-bar-l").style.width = `${Math.max(0, Math.min(100, pL))}%`;
        document.getElementById("vu-bar-r").style.width = `${Math.max(0, Math.min(100, pR))}%`;
    }

    document.getElementById("start-btn").addEventListener("click", startEngine);
    document.getElementById("gain-slider").addEventListener("input", (e) => document.getElementById("gain-val").innerText = e.target.value + "x");
    document.getElementById("attack-slider").addEventListener("input", (e) => document.getElementById("attack-val").innerText = parseFloat(e.target.value).toFixed(2) + "s");
    document.getElementById("decay-slider").addEventListener("input", (e) => document.getElementById("decay-val").innerText = parseFloat(e.target.value).toFixed(2) + "s");
    document.getElementById("freq-slider").addEventListener("input", (e) => document.getElementById("freq-val").innerText = e.target.value + " Hz");
    document.getElementById("cutoff-slider").addEventListener("input", (e) => document.getElementById("cutoff-val").innerText = e.target.value + " Hz");
    document.getElementById("moog-res-slider").addEventListener("input", (e) => document.getElementById("moog-res-val").innerText = parseFloat(e.target.value).toFixed(2));
    document.getElementById("obe-res-slider").addEventListener("input", (e) => document.getElementById("obe-res-val").innerText = parseFloat(e.target.value).toFixed(2));
    document.getElementById("lfo-freq-slider").addEventListener("input", (e) => document.getElementById("lfo-freq-val").innerText = parseFloat(e.target.value).toFixed(1) + " Hz");
    document.getElementById("lfo-depth-slider").addEventListener("input", (e) => document.getElementById("lfo-depth-val").innerText = e.target.value + " Hz");
    document.getElementById("room-slider").addEventListener("input", (e) => document.getElementById("room-val").innerText = e.target.value + "s");
    document.getElementById("damping-slider").addEventListener("input", (e) => document.getElementById("damping-val").innerText = e.target.value);
    document.getElementById("width-slider").addEventListener("input", (e) => document.getElementById("width-val").innerText = e.target.value + "%");
    document.getElementById("wet-slider").addEventListener("input", (e) => document.getElementById("wet-val").innerText = e.target.value + "%");

    for (let i = 1; i <= 6; i++) {
        document.getElementById(`op${i}-ratio-slider`).addEventListener("input", (e) => document.getElementById(`op${i}-ratio-val`).innerText = parseFloat(e.target.value).toFixed(2) + "x");
        document.getElementById(`op${i}-level-slider`).addEventListener("input", (e) => document.getElementById(`op${i}-level-val`).innerText = parseFloat(e.target.value).toFixed(2));
    }

    // ============================================================
    // NOTE-EVENT-SYSTEM: Piano-Keyboard + Computer-Tastatur
    // ============================================================

    // Computer-Tastatur-Mapping (DX7-artig): A=C, W=C#, S=D, E=D#, D=E, F=F, T=F#, G=G, Z=G#, H=A, U=A#, J=B, K=C+1
    const KEY_TO_SEMITONE = {
        'a': 0, 'w': 1, 's': 2, 'e': 3, 'd': 4, 'f': 5, 't': 6,
        'g': 7, 'z': 8, 'h': 9, 'u': 10, 'j': 11, 'k': 12, 'o': 13, 'l': 14
    };
    const KEY_LABELS = { 0:'A', 1:'W', 2:'S', 3:'E', 4:'D', 5:'F', 6:'T', 7:'G', 8:'Z', 9:'H', 10:'U', 11:'J', 12:'K', 13:'O', 14:'L' };

    // Basis-Oktave: A2 = 110 Hz (Semiton 0). 15 Tasten = 2 Oktaven.
    const BASE_FREQ = 110.0;
    const NUM_SEMITONES = 15;
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    function semitoneToFreq(semi) { return BASE_FREQ * Math.pow(2, semi / 12); }

    // On-Screen Piano generieren (nur weiße Tasten-Optik, alle 15 Semitöne klickbar)
    const pianoContainer = document.getElementById("piano-container");
    for (let semi = 0; semi < NUM_SEMITONES; semi++) {
        const key = document.createElement("div");
        key.className = "key";
        key.dataset.semitone = semi;
        const noteName = NOTE_NAMES[(semi + 9) % 12]; // A2-Basis: Semi 0 = A
        const octave = Math.floor((semi + 9) / 12) + 2;
        key.innerHTML = `<span class="key-note">${noteName}${octave}</span><span class="key-label">${KEY_LABELS[semi] || ''}</span>`;
        key.addEventListener("mousedown", () => triggerNoteOn(semi, key));
        key.addEventListener("mouseup", () => triggerNoteOff(key));
        key.addEventListener("mouseleave", () => triggerNoteOff(key));
        pianoContainer.appendChild(key);
    }

    function updateGateStatus() {
        const el = document.getElementById("gate-status");
        if (el && audioEngine) el.innerText = "Gate: " + (audioEngine.is_gate_on() ? "ON" : "OFF");
    }

    function triggerNoteOn(semi, keyElement) {
        if (!audioEngine) return;
        const freq = semitoneToFreq(semi);
        // Frequenz-Slider synchronisieren, damit die Glättung folgt
        document.getElementById("freq-slider").value = freq.toFixed(0);
        document.getElementById("freq-val").innerText = freq.toFixed(0) + " Hz";
        audioEngine.note_on(freq);
        if (keyElement) keyElement.classList.add("active");
        updateGateStatus();
    }

    function triggerNoteOff(keyElement) {
        if (!audioEngine) return;
        if (document.getElementById("drone-mode").checked) return; // Drone: Gate bleibt offen
        audioEngine.note_off();
        if (keyElement) keyElement.classList.remove("active");
        updateGateStatus();
    }

    // Computer-Tastatur (keydown/keyup mit Repeat-Unterdrückung)
    const heldKeys = new Set();
    window.addEventListener("keydown", (e) => {
        if (e.repeat) return;
        const semi = KEY_TO_SEMITONE[e.key.toLowerCase()];
        if (semi === undefined) return;
        if (heldKeys.has(e.key.toLowerCase())) return;
        heldKeys.add(e.key.toLowerCase());
        const keyEl = document.querySelector(`.key[data-semitone="${semi}"]`);
        triggerNoteOn(semi, keyEl);
    });
    window.addEventListener("keyup", (e) => {
        const k = e.key.toLowerCase();
        if (!heldKeys.has(k)) return;
        heldKeys.delete(k);
        const semi = KEY_TO_SEMITONE[k];
        const keyEl = document.querySelector(`.key[data-semitone="${semi}"]`);
        triggerNoteOff(keyEl);
    });

    // Drone-Modus Toggle
    document.getElementById("drone-mode").addEventListener("change", (e) => {
        if (!audioEngine) return;
        if (e.target.checked) {
            const f = parseFloat(document.getElementById("freq-slider").value);
            targets.freq = f; current.freq = f;
            audioEngine.note_on(f);
        } else {
            audioEngine.note_off();
        }
        updateGateStatus();
    });

    // Sustain/Release Slider-Displays
    document.getElementById("sustain-slider").addEventListener("input", (e) => document.getElementById("sustain-val").innerText = e.target.value + "%");
    document.getElementById("release-slider").addEventListener("input", (e) => document.getElementById("release-val").innerText = parseFloat(e.target.value).toFixed(2) + "s");
</script>
</body>
</html>
